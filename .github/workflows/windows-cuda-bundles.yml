name: Windows CUDA source bundles

on:
  pull_request:
    paths:
      - cpp/**
      - scripts/windows_cuda_sdk.py
      - scripts/build_windows_cuda_bundle.py
      - scripts/windows_cuda*.lock.json
      - scripts/test_windows_cuda_bundle.py
      - .github/workflows/windows-cuda-bundles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [windows-nvidia, windows-nvidia-cuda13]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the actual source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select the MSVC 14.44 x64 toolset
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio 2022 C++ tools missing' }
          $developer = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $variables = & cmd.exe /d /s /c "`"$developer`" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=14.44 && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsVersion', 'VSCMD_ARG_TGT_ARCH', 'WindowsSDKVersion', 'WindowsSdkDir', 'VCToolsInstallDir', 'VCINSTALLDIR')
          foreach ($line in $variables) {
            if ($line -match '^([^=]+)=(.*)$' -and $Matches[1] -in $allowed) {
              Add-Content -LiteralPath $env:GITHUB_ENV -Value $line
            }
          }
      - name: Install the fixed CMake and Ninja versions
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.3
      - name: Check bundle validation regressions
        run: python -B -m unittest discover -s scripts -p test_windows_cuda_bundle.py -v
      - name: Build, inspect every runtime DLL, and seal the source bundle
        run: |
          python -B scripts/build_windows_cuda_bundle.py --source . --source-sha $env:SOURCE_SHA --target '${{ matrix.target }}' --output "$env:RUNNER_TEMP/katago-${{ matrix.target }}" --cache "$env:RUNNER_TEMP/cuda-downloads" --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'CUDA source bundle build failed' }
      - name: Upload the verified release ZIP and its immutable identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: katago-source-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/katago-${{ matrix.target }}/katago-source-*.zip
            ${{ runner.temp }}/katago-${{ matrix.target }}/artifact-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build and dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: katago-cuda-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/katago-${{ matrix.target }}/source-package.json
            ${{ runner.temp }}/katago-${{ matrix.target }}/build.log
            ${{ runner.temp }}/katago-${{ matrix.target }}/runtests.log
            ${{ runner.temp }}/katago-${{ matrix.target }}/runoutputtests.log
            ${{ runner.temp }}/katago-${{ matrix.target }}/sdk/build.log
            ${{ runner.temp }}/katago-${{ matrix.target }}/sdk/prefix/sdk-receipt.json
          retention-days: 14
