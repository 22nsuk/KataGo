name: Python board regressions

on:
  push:
    branches: [master]
    paths:
      - python/katago/game/**
      - python/tests/test_board_zobrist.py
      - '**/conftest.py'
      - pytest.ini
      - python/pytest.ini
      - .github/workflows/python-board.yml
  pull_request:
    branches: [master]
    paths:
      - python/katago/game/**
      - python/tests/test_board_zobrist.py
      - '**/conftest.py'
      - pytest.ini
      - python/pytest.ini
      - .github/workflows/python-board.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install board-only test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==8.3.5
      - name: Check incremental hashes and capture undo
        working-directory: python
        run: |
          git rev-parse HEAD
          git hash-object katago/game/board.py tests/test_board_zobrist.py
          # python/pytest.ini adds the entire tests directory; clear only that extra selection.
          python -m pytest -o addopts= tests/test_board_zobrist.py -v --junitxml="$RUNNER_TEMP/python-board.xml"
          git diff --exit-code
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-board-results
          path: ${{ runner.temp }}/python-board.xml
          retention-days: 7
